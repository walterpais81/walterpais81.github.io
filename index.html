<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Walter Pais</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }
        .profile {
            background: #fff;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            text-align: center;
        }
        .profile img {
            width: 160px;
            height: 160px;
            object-fit: cover;
            border-radius: 50%;
            border: 4px solid #0078d7;
            margin-bottom: 1rem;
        }
        .profile h1 {
            margin: 0;
            font-size: 2rem;
            color: #222;
        }
    </style>
</head>
<body>
    <div class="profile">
    <img id="avatar" src="" alt="Foto de perfil de GitHub">
    <h1 id="name"></h1>
    <p id="bio" style="color:#555;"></p>
    <a id="profile-link" href="#" target="_blank" style="color:#0078d7;text-decoration:none;font-weight:bold;">Ver perfil en GitHub</a>
    </div>
</body>
    <script>
        fetch('https://api.github.com/users/walterpais81')
            .then(response => response.json())
            .then(data => {
                document.getElementById('avatar').src = data.avatar_url;
                document.getElementById('name').textContent = data.name || data.login;
                document.getElementById('bio').textContent = data.bio || '';
                document.getElementById('profile-link').href = data.html_url;
            });
    </script>
</html>
